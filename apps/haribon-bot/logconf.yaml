version: 1
disable_existing_loggers: False
formatters:
    normal:
        format: '%(levelname)-10.10s %(asctime)s [%(name)s][%(module)s:%(lineno)d] %(message)s'
        datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
    console:
        formatter: normal
        class: logging.StreamHandler
        stream: ext://sys.stdout
    file:
        formatter: normal
        class: logging.FileHandler
        level: DEBUG
        filename: ./logs/main.log

loggers:
    tools:
        level: DEBUG
        handlers:
            - file
            - console
        propagate: no
    pymongo:
        level: WARNING
        handlers:
            - console
        propagate: no
    urllib3:
        level: WARNING
        handlers:
            - console
        propagate: no
    asyncio:
        level: WARNING
        handlers:
            - console
        propagate: no

root:
    level: DEBUG
    handlers:
        - file
        - console
    propagate: no
