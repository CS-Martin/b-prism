name: Build Authentication Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'libs/backend/database-services/authentication-mongodb-lib/**'
      - 'apps/authentication-service/**'
      - 'package.json'
      - 'prisma/schema.prisma'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push authentication service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/authentication-service/Dockerfile.prod
          push: true
          tags: martin09123/project-haribon:authentication-service
          cache-from: type=gha
          cache-to: type=gha,mode=max
