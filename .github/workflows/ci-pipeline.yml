name: Haribon CI Pipeline

on:
    push:
        branches:
            - production
    pull_request:

permissions:
    actions: read
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 22.11.0 # Updated to match your local Node.js version
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Set up Nx Cloud Token
              run: echo "NX_CLOUD_ACCESS_TOKEN=${{ secrets.NX_CLOUD_ACCESS_TOKEN }}" >> $GITHUB_ENV

            - name: Debug Env Variables
              run: printenv

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to Dockerhub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Distribute Nx Cloud Agents (Optional)
              run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

            - name: Set up environment variables
              run: |
                  echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
                  echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

            - name: Debug Env Variables
              run: printenv

            - name: Record Nx Cloud
              run: npx nx-cloud record -- nx format:check

            - name: Run Nx Affected (Important for Nx Caching)
              run: npx nx affected --target=build --parallel=3 --configuration=production

            - name: Build, Tag, and Push Docker image with Cache
              uses: docker/build-push-action@v4
              with:
                  context: .
                  file: Dockerfile.prod
                  push: true
                  tags: martin09123/haribon-microservices:latest
                  cache-from: type=registry,ref=martin09123/haribon-microservices:cache
                  cache-to: type=registry,ref=martin09123/haribon-microservices:cache,mode=max
