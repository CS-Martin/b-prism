name: Haribon CI Pipeline
# hey
on:
    push:
        branches: ['production']

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to Dockerhub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up environment variables
              run: |
                  echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
                  echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

            - name: Build, Tag, and Push Docker image with Cache
              uses: docker/build-push-action@v4
              with:
                  context: .
                  file: Dockerfile.prod
                  push: true
                  tags: martin09123/haribon-microservices:latest
                  cache-from: type=registry,ref=martin09123/haribon-microservices:cache
                  cache-to: type=registry,ref=martin09123/haribon-microservices:cache,mode=max
