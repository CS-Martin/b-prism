name: Haribon CI Pipeline

on:
    push:
        branches: ['production']

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Install Docker Compose Plugin
              run: |
                  sudo apt-get update && apt-get install -y docker-compose-plugin

            - name: Set up environment variables
              run: |
                  echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
                  echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

            - name: Login to Dockerhub
              env:
                  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
              run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            - name: Build the Docker image
              run: docker-compose -f docker-compose.prod.yml build

            - name: Tag the image
              run: docker tag haribon-microservices martin09123/haribon-microservices:latest

            - name: Push the image to Dockerhub
              run: docker push martin09123/haribon-microservices:latest
